name = "prepro2LDRM-slabvars"
version = "0.1.0"
license = "license"
author = "Erick Claros"
maintainer = "erickkc2@illinois.edu"
copyright = "Copyright 2024, Erick Claros"
[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
# netcdf module of the installed NetCDF-Fortran: build with --flag "$(nf-config --fflags)"
external-modules = "netcdf"
link = ["netcdff", "netcdf"]
[install]
library = false
[fortran]
implicit-typing = true    #false by default
implicit-external = true  #false by default
source-form = "free"
[preprocess]
[preprocess.cpp]
# USE_MPI: parallel version. For a serial build (no MPI library needed), remove
# USE_MPI here and the mpi dependency below
macros = ["USE_MPI"]
[dependencies]
# FLAP needs a compiler that supports Fortran 2018 or later (stop ..., quiet=), e.g. gfortran 12 or newer
FLAP = { git="https://github.com/szaghi/FLAP.git", tag="v2.5.3" }
mpi = "*"
# stdlib-fpm branch of fortran-lang/stdlib, same revision as 2L-DRM (stdlib_system is used)
stdlib = { git="https://github.com/fortran-lang/stdlib", rev="58eb9133966c2797e0593281169ef57c43eccc1d" }
